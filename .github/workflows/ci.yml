name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: readaroo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create tables
        run: npm run db:setup
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/readaroo
          READAROO_APP_PASSWORD: ci-only
      - name: Offline and live tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://readaroo_app:ci-only@localhost:5432/readaroo
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/readaroo
      - name: Seed files rebuild identically
        run: |
          python3 data/generate_data.py
          git diff --exit-code data/seed.json db/002_seed.sql
